<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Viswam EduTech Online Exam</title>
<style>
:root{--bg:#f4f6fb;--card:#fff;--tx:#0f172a;--mut:#64748b;--bd:#e2e8f0;--ac:#2563eb;--ok:#059669;--wa:#d97706;--er:#dc2626;--in:#f8fafc;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b1220;--card:#131c2e;--tx:#e2e8f0;--mut:#94a3b8;--bd:#24304a;--ac:#60a5fa;--ok:#34d399;--wa:#fbbf24;--er:#f87171;--in:#0f1726}}
:root[data-theme="dark"]{--bg:#0b1220;--card:#131c2e;--tx:#e2e8f0;--mut:#94a3b8;--bd:#24304a;--ac:#60a5fa;--ok:#34d399;--wa:#fbbf24;--er:#f87171;--in:#0f1726}
*{box-sizing:border-box;margin:0}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{background:var(--bg);color:var(--tx);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh}
.wrap{max-width:1100px;margin:0 auto;padding:16px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:18px;margin-bottom:16px}
h1{font-size:1.3em}h2{font-size:1.1em;margin-bottom:12px}
input,select,textarea{width:100%;padding:10px;border:1px solid var(--bd);border-radius:8px;background:var(--in);color:var(--tx);font:inherit;margin:4px 0 10px}
label{font-size:.85em;color:var(--mut);font-weight:600}
button{font:inherit;cursor:pointer;border:1px solid var(--bd);background:var(--card);color:var(--tx);padding:8px 14px;border-radius:8px;font-weight:600}
button.p{background:var(--ac);border-color:var(--ac);color:#fff}button.g{background:var(--ok);border-color:var(--ok);color:#fff}button.d{color:var(--er);border-color:var(--er)}
button:disabled{opacity:.5}
.bar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.tabs{display:flex;gap:6px;overflow-x:auto;margin-bottom:16px}.tabs button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:16px}
.stat{text-align:center}.stat b{display:block;font-size:1.8em;color:var(--ac)}
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:.92em}th,td{padding:8px;border-bottom:1px solid var(--bd);text-align:left;white-space:nowrap}th{color:var(--mut)}
.badge{padding:2px 9px;border-radius:99px;font-size:.8em;font-weight:700;background:var(--in);border:1px solid var(--bd)}
.ok{color:var(--ok)}.er{color:var(--er)}.wa{color:var(--wa)}.mut{color:var(--mut)}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}@media(max-width:600px){.row{grid-template-columns:1fr}}
.ex{display:grid;grid-template-columns:1fr 230px;gap:16px}@media(max-width:800px){.ex{grid-template-columns:1fr}}
.opt{display:flex;gap:10px;align-items:center;padding:10px;border:1px solid var(--bd);border-radius:8px;margin:6px 0;cursor:pointer;color:var(--tx);font-weight:400;font-size:1em}
.opt input{width:auto;margin:0}.opt.sel{border-color:var(--ac);background:var(--in)}
.pal{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}.pal button{padding:6px}.pal .an{background:var(--ok);color:#fff;border-color:var(--ok)}.pal .cu{outline:2px solid var(--ac)}
.tm{font:700 2em ui-monospace,monospace;text-align:center;color:var(--ac)}.tm.lo{color:var(--er)}
img.q{max-width:100%;max-height:320px;border-radius:8px;margin:8px 0}
#toast{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));right:12px;z-index:9;display:grid;gap:8px}
#toast div{background:var(--card);border:1px solid var(--bd);border-left:4px solid var(--ok);padding:10px 14px;border-radius:8px;box-shadow:0 4px 14px #0003}#toast .e{border-left-color:var(--er)}
.login{max-width:400px;margin:8vh auto}
.nocopy{user-select:none;-webkit-user-select:none}
</style>
</head>
<body>
<div id="toast"></div>
<div class="wrap" id="app"></div>
<script>
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const K='vxexam2',MAXV=3;
let db,me=null,view='',role='admin',draft=null,tick=null,ses=null,reviewId=null;
const sha=async s=>[...new Uint8Array(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s)))].map(b=>b.toString(16).padStart(2,'0')).join('');
const save=()=>{};
function toast(m,e){const d=document.createElement('div');d.textContent=m;if(e)d.className='e';$('toast').appendChild(d);setTimeout(()=>d.remove(),3200)}
async function init(){
  try{db=JSON.parse(localStorage.getItem(K))}catch(e){}
  if(!db){db={users:[{email:'admin@school.edu',name:'Admin',role:'admin',pw:await sha('admin123')},{email:'john@school.edu',name:'John Doe',role:'student',pw:await sha('student123')}],papers:[],results:[],viol:[],sessions:{}};save()}
  try{me=JSON.parse(sessionStorage.getItem('vxme'))}catch(e){}
  me?enter():loginUI();
}
function loginUI(){
  $('app').innerHTML=`<div class="card login"><h1 style="text-align:center">🎓 Viswam EduTech<br><span class="mut" style="font-size:.7em">Online Exam Platform</span></h1><br>
  <div class="row"><button id="rA" class="${role=='admin'?'p':''}" onclick="role='admin';loginUI()">Admin</button><button id="rS" class="${role=='student'?'p':''}" onclick="role='student';loginUI()">Student</button></div><br>
  <label>Email</label><input id="em" type="email" autocomplete="username"><label>Password</label><input id="pw" type="password" autocomplete="current-password" onkeydown="event.key=='Enter'&&login()">
  <button class="p" style="width:100%" onclick="login()">Login</button>
  <p class="mut" style="margin-top:12px;font-size:.85em">Demo: admin@school.edu / admin123 · john@school.edu / student123<br>Bulk-uploaded students log in with their Student ID as password.</p></div>`;
}
async function login(){
  const e=$('em').value.trim().toLowerCase(),h=await sha($('pw').value);
  const u=db.users.find(u=>u.email===e&&u.pw===h&&u.role===role);
  if(!u)return toast('Invalid credentials',1);
  me={email:u.email,name:u.name,role:u.role};sessionStorage.setItem('vxme',JSON.stringify(me));enter();
}
function logout(){if(ses&&!confirm('Leave exam? Your progress is saved and the timer keeps running.'))return;clearInterval(tick);ses=null;me=null;sessionStorage.removeItem('vxme');loginUI()}
function enter(){const s=db.sessions[me.email];go(me.role=='admin'?'dash':(s?'exam':'list'))}
function shell(tabs,body){
  $('app').innerHTML=`<div class="bar"><div><h1>🎓 Viswam EduTech</h1></div><div><span class="mut">${esc(me.name)} (${me.role})</span> <button onclick="logout()">Logout</button></div></div>
  ${tabs?`<div class="tabs">${tabs.map(([k,l])=>`<button class="${view==k?'on':''}" onclick="go('${k}')">${l}</button>`).join('')}</div>`:''}${body}`;
}
function go(v){view=v;if(v!='exam')clearInterval(tick);
  if(me.role=='admin')({dash:aDash,paper:aPaper,papers:aPapers,students:aStudents,log:aLog})[v]();
  else({list:sList,exam:sExam,res:sRes})[v]()}
const AT=[['dash','📊 Dashboard'],['papers','📋 Papers'],['paper','➕ Create Paper'],['students','👥 Students'],['log','🚨 Proctoring']];
const ST=[['list','📝 Papers'],['res','✅ Results']];
const paperMarks=p=>p.questions.reduce((s,q)=>s+(+q.marks||0),0);

/* ---------- ADMIN ---------- */
function aDash(){
  const r=db.results,avg=r.length?Math.round(r.reduce((s,x)=>s+x.pct,0)/r.length):'--';
  shell(AT,`<div class="grid">${[['Papers',db.papers.length],['Published',db.papers.filter(p=>p.status=='published').length],['Students',db.users.filter(u=>u.role=='student').length],['Submissions',r.length],['Avg score',avg+(r.length?'%':'')],['Violations',db.viol.length]].map(([a,b])=>`<div class="card stat"><span class="mut">${a}</span><b>${b}</b></div>`).join('')}</div>
  <div class="card"><div class="bar"><h2>Results</h2><button onclick="exportCSV()">⬇ Export CSV</button></div><div class="tw"><table><tr><th>Student</th><th>Exam</th><th>Score</th><th>%</th><th>Status</th><th>Violations</th><th>Date</th><th></th></tr>
  ${r.slice().reverse().map(x=>`<tr><td>${esc(nm(x.email))}</td><td>${esc(x.title)}</td><td>${x.marks}/${x.total}</td><td><b>${x.pct}%</b></td><td class="${x.pass?'ok':'er'}">${x.pass?'PASS':'FAIL'}${x.review?' <span class="badge wa">review</span>':''}</td><td>${x.viol}</td><td>${esc(x.date)}</td><td><button onclick="reviewId=${x.id};aDash()">Review</button></td></tr>`).join('')||'<tr><td colspan="8" class="mut">No submissions yet</td></tr>'}</table></div></div>${reviewId?reviewUI():''}`);
}
const nm=e=>(db.users.find(u=>u.email==e)||{}).name||e;
function reviewUI(){
  const x=db.results.find(r=>r.id==reviewId);if(!x)return'';
  return`<div class="card"><div class="bar"><h2>${esc(nm(x.email))} — ${esc(x.title)}</h2><button onclick="reviewId=null;aDash()">Close</button></div>
  ${x.answers.map((a,i)=>`<div style="border-bottom:1px solid var(--bd);padding:10px 0"><b>Q${i+1}. ${esc(a.text)}</b><div>Answer: <span class="mut">${esc(a.given)||'—'}</span></div><div>Expected: <span class="ok">${esc(a.exp)||'—'}</span></div>
  Marks <input type="number" style="width:80px;display:inline" min="0" max="${a.max}" step="0.5" value="${a.got}" onchange="setMark(${x.id},${i},this.value)"> / ${a.max}</div>`).join('')}</div>`;
}
function setMark(id,i,v){
  const x=db.results.find(r=>r.id==id),a=x.answers[i];a.got=Math.min(a.max,Math.max(0,+v||0));
  x.marks=x.answers.reduce((s,a)=>s+a.got,0);x.pct=Math.round(x.marks/x.total*100);x.pass=x.pct>=x.passPct;x.review=false;save();aDash();toast('Marks updated')}
function exportCSV(){
  const q=v=>`"${String(v).replace(/"/g,'""')}"`;
  const rows=[['Email','Name','Exam','Marks','Total','Percent','Status','Violations','Date'],...db.results.map(x=>[x.email,nm(x.email),x.title,x.marks,x.total,x.pct,x.pass?'PASS':'FAIL',x.viol,x.date])];
  const b=new Blob([rows.map(r=>r.map(q).join(',')).join('\n')],{type:'text/csv'}),a=document.createElement('a');
  a.href=URL.createObjectURL(b);a.download='results.csv';a.click();
}
function aPapers(){
  shell(AT,`<div class="card"><h2>Manage Papers</h2><div class="tw"><table><tr><th>Title</th><th>Subject</th><th>Qs</th><th>Marks</th><th>Status</th><th></th></tr>
  ${db.papers.map(p=>`<tr><td>${esc(p.title)}</td><td>${esc(p.subject)}</td><td>${p.questions.length}</td><td>${paperMarks(p)}</td><td><span class="badge">${p.status}</span></td>
  <td><button onclick="togglePub('${p.id}')">${p.status=='published'?'Unpublish':'Publish'}</button> <button onclick="editPaper('${p.id}')">Edit</button> <button class="d" onclick="delPaper('${p.id}')">Delete</button></td></tr>`).join('')||'<tr><td colspan="6" class="mut">No papers</td></tr>'}</table></div></div>`);
}
function editPaper(id){draft=JSON.parse(JSON.stringify(db.papers.find(p=>p.id==id)));go('paper')}
function blankQ(){return{id:'q'+Date.now()+Math.random().toString(36).slice(2,5),text:'',type:'mcq',marks:1,options:['','','',''],correct:0,answer:'',image:''}}
function aPaper(){
  if(!draft)draft={id:'p'+Date.now(),title:'',subject:'',class:'',duration:60,passPct:40,shuffle:true,status:'draft',questions:[blankQ()]};
  const d=draft;
  shell(AT,`<div class="card"><h2>${db.papers.find(p=>p.id==d.id)?'Edit':'Create'} Paper</h2>
  <label>Title</label><input value="${esc(d.title)}" oninput="draft.title=this.value">
  <div class="row"><div><label>Subject</label><input value="${esc(d.subject)}" oninput="draft.subject=this.value"></div><div><label>Class</label><input value="${esc(d.class)}" oninput="draft.class=this.value"></div>
  <div><label>Duration (min)</label><input type="number" min="1" value="${d.duration}" oninput="draft.duration=+this.value"></div><div><label>Pass mark (%)</label><input type="number" min="1" max="100" value="${d.passPct}" oninput="draft.passPct=+this.value"></div></div>
  <label class="opt"><input type="checkbox" ${d.shuffle?'checked':''} onchange="draft.shuffle=this.checked"> Shuffle question order per student</label></div>
  ${d.questions.map((q,i)=>`<div class="card"><div class="bar"><b>Question ${i+1}</b><button class="d" onclick="delQ(${i})">Remove</button></div>
  <textarea rows="2" placeholder="Question text" oninput="draft.questions[${i}].text=this.value">${esc(q.text)}</textarea>
  <div class="row"><div><label>Type</label><select onchange="draft.questions[${i}].type=this.value;aPaper()">${[['mcq','Multiple choice'],['numeric','Numeric'],['short','Short answer'],['long','Long answer']].map(([v,l])=>`<option value="${v}" ${q.type==v?'selected':''}>${l}</option>`).join('')}</select></div>
  <div><label>Marks</label><input type="number" min="0.5" step="0.5" value="${q.marks}" oninput="draft.questions[${i}].marks=+this.value"></div></div>
  ${q.type=='mcq'?q.options.map((o,j)=>`<div style="display:flex;gap:8px;align-items:center"><input type="radio" style="width:auto" name="c${i}" ${q.correct==j?'checked':''} onchange="draft.questions[${i}].correct=${j}"><input placeholder="Option ${'ABCD'[j]}" value="${esc(o)}" oninput="draft.questions[${i}].options[${j}]=this.value"></div>`).join('')+'<div class="mut">Select the radio button of the correct option.</div>'
  :`<label>${q.type=='numeric'?'Correct number (±1% tolerance)':'Keywords, comma separated (marks awarded in proportion to keywords found)'}</label><input value="${esc(q.answer)}" oninput="draft.questions[${i}].answer=this.value">`}
  <label>Image (optional, auto-compressed)</label><input type="file" accept="image/*" onchange="qImg(${i},this.files[0])">${q.image?`<img class="q" src="${q.image}"> <button onclick="draft.questions[${i}].image='';aPaper()">Remove image</button>`:''}</div>`).join('')}
  <div class="bar"><button onclick="draft.questions.push(blankQ());aPaper()">➕ Add question</button><span><button onclick="savePaper('draft')">Save draft</button> <button class="p" onclick="savePaper('published')">Publish</button> <button onclick="draft=null;go('papers')">Cancel</button></span></div>`);
}
const delQ=i=>{draft.questions.splice(i,1);aPaper()};
function qImg(i,f){
  if(!f)return;const im=new Image();im.onload=()=>{const s=Math.min(1,800/im.width),c=document.createElement('canvas');c.width=im.width*s;c.height=im.height*s;c.getContext('2d').drawImage(im,0,0,c.width,c.height);draft.questions[i].image=c.toDataURL('image/jpeg',.7);aPaper()};im.src=URL.createObjectURL(f)}
function savePaper(status){
  const d=draft;if(!d.title.trim()||!d.subject.trim())return toast('Title and subject required',1);
  if(!d.questions.length)return toast('Add at least one question',1);
  for(const [i,q] of d.questions.entries()){
    if(!q.text.trim())return toast(`Question ${i+1} is empty`,1);
    if(q.type=='mcq'&&q.options.some(o=>!o.trim()))return toast(`Question ${i+1}: fill all options`,1);
    if(status=='published'&&q.type!='mcq'&&!String(q.answer).trim())return toast(`Question ${i+1}: add expected answer/keywords`,1);
    if(q.type=='numeric'&&String(q.answer).trim()&&isNaN(parseFloat(q.answer)))return toast(`Question ${i+1}: answer must be a number`,1)}
  d.status=status;const k=db.papers.findIndex(p=>p.id==d.id);api('/papers','POST',d).then(pull).then(()=>{draft=null;toast('Paper '+status);go('papers')}).catch(()=>{})}
function aStudents(){
  const s=db.users.filter(u=>u.role=='student');
  shell(AT,`<div class="card"><h2>Bulk upload students</h2><p class="mut">CSV columns: Email, First Name, Last Name, Student ID, Class. Header row is skipped. Student ID becomes the initial password.</p><input type="file" id="csv" accept=".csv,.txt"><button class="p" onclick="uploadCSV()">Upload</button></div>
  <div class="card"><h2>Students (${s.length})</h2><div class="tw"><table><tr><th>Name</th><th>Email</th><th>ID</th><th>Class</th></tr>${s.map(u=>`<tr><td>${esc(u.name)}</td><td>${esc(u.email)}</td><td>${esc(u.sid||'')}</td><td>${esc(u.class||'')}</td></tr>`).join('')}</table></div></div>`);
}
async function uploadCSV(){
  const f=$('csv').files[0];if(!f)return toast('Choose a file',1);
  const lines=(await f.text()).split(/\r?\n/).slice(1);let n=0,bad=0;
  for(const l of lines){if(!l.trim())continue;const c=l.split(',').map(x=>x.trim().replace(/^"|"$/g,''));
    if(!/^\S+@\S+\.\S+$/.test(c[0]||'')||!c[3]){bad++;continue}
    const e=c[0].toLowerCase();if(db.users.some(u=>u.email==e)){bad++;continue}
    db.users.push({email:e,name:`${c[1]||''} ${c[2]||''}`.trim(),role:'student',sid:c[3],class:c[4]||'',pw:await sha(c[3])});n++}
  save();toast(`${n} added, ${bad} skipped`,!n);aStudents()}
function aLog(){
  shell(AT,`<div class="card"><h2>Violation log</h2><p class="mut">Tab switches, leaving fullscreen and copy/paste attempts are logged automatically. After ${MAXV} tab/fullscreen violations the exam auto-submits.</p>
  <div class="tw"><table><tr><th>Time</th><th>Student</th><th>Exam</th><th>Type</th></tr>${db.viol.slice().reverse().map(v=>`<tr><td>${new Date(v.t).toLocaleString()}</td><td>${esc(nm(v.email))}</td><td>${esc(v.paper)}</td><td class="wa">${esc(v.type)}</td></tr>`).join('')||'<tr><td colspan="4" class="mut">None recorded</td></tr>'}</table></div></div>
  <div class="card"><h2>Live sessions</h2><div class="tw"><table><tr><th>Student</th><th>Exam</th><th>Answered</th><th>Violations</th></tr>${Object.values(db.sessions).map(s=>{const p=db.papers.find(p=>p.id==s.pid);return`<tr><td>${esc(nm(s.email))}</td><td>${esc(p?.title)}</td><td>${Object.values(s.a).filter(x=>String(x).trim()!=='').length}/${s.order.length}</td><td>${s.v}</td></tr>`}).join('')||'<tr><td colspan="4" class="mut">No live sessions</td></tr>'}</table></div></div>`);
}

/* ---------- STUDENT ---------- */
function sList(){
  const ps=db.papers.filter(p=>p.status=='published'),done=id=>db.results.some(r=>r.email==me.email&&r.pid==id);
  shell(ST,`<div class="card"><h2>Available papers</h2><div class="tw"><table><tr><th>Title</th><th>Subject</th><th>Questions</th><th>Duration</th><th></th></tr>${ps.map(p=>`<tr><td>${esc(p.title)}</td><td>${esc(p.subject)}</td><td>${p.questions.length}</td><td>${p.duration} min</td><td>${done(p.id)?'<span class="badge ok">Completed</span>':`<button class="p" onclick="startExam('${p.id}')">Start</button>`}</td></tr>`).join('')||'<tr><td colspan="5" class="mut">No papers available</td></tr>'}</table></div>
  <p class="mut" style="margin-top:10px">Each exam can be attempted once. Exam opens in fullscreen; switching tabs or leaving fullscreen is recorded.</p></div>`);
}
function startExam(id){
  const p=db.papers.find(p=>p.id==id);if(!confirm(`Start "${p.title}"? The ${p.duration}-minute timer begins now and cannot be paused.`))return;
  let o=p.questions.map(q=>q.id);if(p.shuffle)for(let i=o.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[o[i],o[j]]=[o[j],o[i]]}
  db.sessions[me.email]={email:me.email,pid:id,start:Date.now(),order:o,a:{},i:0,v:0};save();
  document.documentElement.requestFullscreen?.().catch(()=>{});go('exam')}
function sExam(){
  ses=db.sessions[me.email];if(!ses)return go('list');
  const p=db.papers.find(p=>p.id==ses.pid);if(!p){delete db.sessions[me.email];save();return go('list')}
  const qs=ses.order.map(id=>p.questions.find(q=>q.id==id)).filter(Boolean),q=qs[ses.i],a=ses.a[q.id];
  const ans=id=>String(ses.a[id]??'').trim()!=='';
  shell(null,`<div class="ex nocopy"><div class="card"><div class="bar"><b>${esc(p.title)}</b><span class="mut">Q${ses.i+1}/${qs.length} · ${q.marks} mark(s)</span></div>
  <p style="font-weight:600;white-space:pre-wrap">${esc(q.text)}</p>${q.image?`<img class="q" src="${q.image}">`:''}
  ${q.type=='mcq'?q.options.map((o,j)=>`<label class="opt ${a===j?'sel':''}"><input type="radio" name="o" ${a===j?'checked':''} onchange="ans('${q.id}',${j});sExam()"> ${'ABCD'[j]}. ${esc(o)}</label>`).join('')
  :q.type=='numeric'?`<input type="number" step="any" value="${esc(a??'')}" oninput="ans('${q.id}',this.value,1)">`
  :`<textarea rows="${q.type=='long'?9:3}" oninput="ans('${q.id}',this.value,1)">${esc(a??'')}</textarea>`}
  <div class="bar" style="margin-top:12px"><button ${ses.i?'':'disabled'} onclick="nav(${ses.i-1})">← Prev</button>${ses.i<qs.length-1?`<button class="p" onclick="nav(${ses.i+1})">Next →</button>`:`<button class="g" onclick="if(confirm('Submit exam? ${qs.filter(x=>!ans(x.id)).length} unanswered.'))submitExam()">Submit ✓</button>`}</div></div>
  <div><div class="card"><div class="tm" id="tm">--:--</div><div class="mut" style="text-align:center">Time left</div></div>
  <div class="card"><div class="pal">${qs.map((x,i)=>`<button class="${ans(x.id)?'an':''} ${i==ses.i?'cu':''}" onclick="nav(${i})">${i+1}</button>`).join('')}</div><p class="mut" style="margin-top:8px">Violations: <b class="${ses.v?'er':''}">${ses.v}/${MAXV}</b></p><button class="g" style="width:100%" onclick="if(confirm('Submit exam?'))submitExam()">Submit</button></div></div></div>`);
  clearInterval(tick);tick=setInterval(upTimer,1000);upTimer();
}
function ans(id,v,quiet){ses.a[id]=v;save();if(!quiet)return}
function upTimer(){
  const p=db.papers.find(p=>p.id==ses?.pid);if(!p)return;
  const left=Math.max(0,Math.round((ses.start+p.duration*60000-Date.now())/1000)),t=$('tm');
  if(t){t.textContent=String(Math.floor(left/60)).padStart(2,'0')+':'+String(left%60).padStart(2,'0');t.className='tm'+(left<=60?' lo':'')}
  if(left<=0){clearInterval(tick);toast('Time is up - submitting');submitExam()}}
function flag(type){
  if(!ses||!me)return;const p=db.papers.find(p=>p.id==ses.pid);
  db.viol.push({t:Date.now(),email:me.email,paper:p?.title||'',type});
  if(type!='Copy/paste attempt'){ses.v++;toast(`⚠ ${type} recorded (${ses.v}/${MAXV})`,1)}
  save();if(ses.v>=MAXV)submitExam();else if(view=='exam'&&type!='Copy/paste attempt')sExam()}
document.addEventListener('visibilitychange',()=>{if(document.hidden&&ses&&view=='exam')flag('Tab switch')});
document.addEventListener('fullscreenchange',()=>{if(!document.fullscreenElement&&ses&&view=='exam')flag('Left fullscreen')});
['copy','paste','cut','contextmenu'].forEach(e=>document.addEventListener(e,ev=>{if(ses&&view=='exam'){ev.preventDefault();flag('Copy/paste attempt')}}));
window.addEventListener('beforeunload',e=>{if(ses&&view=='exam'){e.preventDefault();e.returnValue=''}});
function grade(q,a){
  const s=String(a??'').trim();if(!s)return 0;
  if(q.type=='mcq')return a===q.correct?q.marks:0;
  if(q.type=='numeric'){const u=parseFloat(s),c=parseFloat(q.answer);return!isNaN(u)&&Math.abs(u-c)<=Math.max(Math.abs(c)*.01,1e-9)?q.marks:0}
  const kw=String(q.answer).toLowerCase().split(',').map(x=>x.trim()).filter(Boolean);if(!kw.length)return 0;
  const hit=kw.filter(k=>s.toLowerCase().includes(k)).length;return Math.round(q.marks*hit/kw.length*2)/2}
function submitExam(){
  if(!ses)return;clearInterval(tick);const p=db.papers.find(p=>p.id==ses.pid),s=ses;ses=null;
  const answers=p.questions.map(q=>{const g=s.a[q.id];return{text:q.text,type:q.type,max:q.marks,got:grade(q,g),
    given:q.type=='mcq'&&g!=null?`${'ABCD'[g]}. ${q.options[g]}`:String(g??''),exp:q.type=='mcq'?`${'ABCD'[q.correct]}. ${q.options[q.correct]}`:q.answer}});
  const total=paperMarks(p),marks=answers.reduce((x,a)=>x+a.got,0),pct=total?Math.round(marks/total*100):0;
  db.results.push({id:Date.now(),email:s.email,pid:p.id,title:p.title,marks,total,pct,passPct:p.passPct,pass:pct>=p.passPct,viol:s.v,answers,date:new Date().toLocaleString(),review:p.questions.some(q=>q.type=='long'||q.type=='short')});
  delete db.sessions[s.email];save();if(document.fullscreenElement)document.exitFullscreen();
  toast('Exam submitted');go('res')}
function sRes(){
  const r=db.results.filter(x=>x.email==me.email);
  shell(ST,`<div class="card"><h2>My results</h2><div class="tw"><table><tr><th>Exam</th><th>Score</th><th>%</th><th>Status</th><th>Date</th></tr>${r.slice().reverse().map(x=>`<tr><td>${esc(x.title)}</td><td>${x.marks}/${x.total}</td><td><b>${x.pct}%</b></td><td class="${x.pass?'ok':'er'}">${x.pass?'PASS':'FAIL'}${x.review?' <span class="badge wa">provisional</span>':''}</td><td>${esc(x.date)}</td></tr>`).join('')||'<tr><td colspan="5" class="mut">No results yet</td></tr>'}</table></div>
  <p class="mut" style="margin-top:8px">Short/long answers are keyword-graded and may be adjusted by your teacher.</p></div>`);
}
</script>
<script>
/* ---- API layer: overrides the localStorage functions above ---- */
let TOKEN=sessionStorage.getItem('vxtok')||'',skew=0,st;
async function api(path,method='GET',body){
  const r=await fetch('/api'+path,{method,headers:{'Content-Type':'application/json',...(TOKEN?{Authorization:'Bearer '+TOKEN}:{})},body:body?JSON.stringify(body):undefined});
  const j=await r.json().catch(()=>({}));
  if(r.status==401&&TOKEN){TOKEN='';me=null;ses=null;sessionStorage.clear();loginUI()}
  if(!r.ok){const m=typeof j.detail=='string'?j.detail:'Request failed';toast(m,1);throw new Error(m)}
  return j}
async function pull(){
  const A=me.role=='admin',[papers,results,sess,t]=await Promise.all([api('/papers'),api('/results'),api('/sessions'),api('/time')]);
  skew=t.now-Date.now();db={users:[{email:me.email,name:me.name,role:me.role}],papers,results,viol:[],sessions:{}};
  if(A){db.users=await api('/students');db.viol=await api('/violations')}
  sess.forEach(s=>db.sessions[s.email]=s)}
async function init(){
  try{me=JSON.parse(sessionStorage.getItem('vxme'))}catch(e){}
  if(me&&TOKEN){try{await pull();enter()}catch(e){loginUI()}}else loginUI()}
async function login(){
  try{const j=await api('/login','POST',{email:$('em').value,password:$('pw').value,role});
    TOKEN=j.token;me=j.user;sessionStorage.setItem('vxtok',TOKEN);sessionStorage.setItem('vxme',JSON.stringify(me));await pull();enter()}catch(e){}}
function logout(){if(ses&&!confirm('Leave exam? Progress is saved and the timer keeps running.'))return;clearInterval(tick);ses=null;me=null;TOKEN='';sessionStorage.clear();loginUI()}
async function togglePub(id){const p=db.papers.find(p=>p.id==id);p.status=p.status=='published'?'draft':'published';try{await api('/papers','POST',p);await pull();aPapers()}catch(e){}}
async function delPaper(id){if(!confirm('Delete paper?'))return;try{await api('/papers/'+id,'DELETE');await pull();aPapers()}catch(e){}}
async function uploadCSV(){
  const f=$('csv').files[0];if(!f)return toast('Choose a file',1);
  const rows=(await f.text()).split(/\r?\n/).slice(1).filter(l=>l.trim()).map(l=>l.split(',').map(x=>x.trim().replace(/^"|"$/g,'')));
  try{const j=await api('/students/bulk','POST',{rows});toast(`${j.added} added, ${j.skipped} skipped`,!j.added);await pull();aStudents()}catch(e){}}
async function setMark(id,i,v){try{await api(`/results/${id}/marks`,'PATCH',{index:i,marks:+v||0});await pull();aDash();toast('Marks updated')}catch(e){}}
async function startExam(id){
  const p=db.papers.find(p=>p.id==id);if(!confirm(`Start "${p.title}"? The ${p.duration}-minute timer begins now and cannot be paused.`))return;
  try{await api('/exams/'+id+'/start','POST');await pull();document.documentElement.requestFullscreen?.().catch(()=>{});go('exam')}catch(e){}}
function flush(){return ses?api('/exams/session','PUT',{a:ses.a,i:ses.i}).catch(()=>{}):Promise.resolve()}
function ans(id,v){ses.a[id]=v;clearTimeout(st);st=setTimeout(flush,500)}
function nav(i){ses.i=i;flush();sExam()}
function upTimer(){
  const p=db.papers.find(p=>p.id==ses?.pid);if(!p)return;
  const left=Math.max(0,Math.round((ses.start+p.duration*60000-(Date.now()+skew))/1000)),t=$('tm');
  if(t){t.textContent=String(Math.floor(left/60)).padStart(2,'0')+':'+String(left%60).padStart(2,'0');t.className='tm'+(left<=60?' lo':'')}
  if(left<=0){clearInterval(tick);toast('Time is up - submitting');submitExam()}}
async function flag(type){
  if(!ses||!me)return;const j=await api('/violations','POST',{type}).catch(()=>null);if(!j||!ses)return;
  if(type!='Copy/paste attempt'){ses.v=j.count;toast(`⚠ ${type} recorded (${j.count}/${MAXV})`,1)}
  if(j.autosubmit)submitExam();else if(view=='exam'&&type!='Copy/paste attempt')sExam()}
async function submitExam(){
  if(!ses)return;const s=ses;ses=null;clearInterval(tick);clearTimeout(st);
  await api('/exams/session','PUT',{a:s.a,i:s.i}).catch(()=>{});
  await api('/exams/submit','POST').catch(()=>{});
  await pull();if(document.fullscreenElement)document.exitFullscreen();toast('Exam submitted');go('res')}
setInterval(async()=>{if(me?.role=='admin'&&view=='log'){try{await pull();aLog()}catch(e){}}},10000);
init();
</script>
